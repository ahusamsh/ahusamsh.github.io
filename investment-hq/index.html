<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Investment HQ">
  <title>Investment HQ</title>
  <link rel="manifest" href="./manifest.webmanifest?v=19">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles-v19.css?v=19">
</head>
<body>
  <div id="lockScreen" class="lock-screen">
    <section class="lock-card">
      <div class="cmd">C:\INVESTMENT\HQ\AUTH&gt;</div>
      <h1>الاستثمار</h1>
      <form id="unlockForm" class="unlock-form">
        <label for="accessKey">مفتاح الوصول</label>
        <input id="accessKey" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">[ فتح ]</button>
        <label class="check-row"><input id="rememberKey" type="checkbox" checked><span>تذكّر المفتاح</span></label>
        <p id="lockError" class="form-error" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-path">C:\INVESTMENT\HQ&gt;</div>
        <h1>الاستثمار</h1>
      </div>
      <div class="top-actions">
        <span id="syncBadge" class="sync-status syncing">● مزامنة…</span>
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="مزامنة">↻</button>
      </div>
    </header>

    <main>
      <section id="metrics" class="metrics" aria-label="المؤشرات"></section>

      <section class="section">
        <div class="section-head">
          <h2>رسائل لم يردوا عليها</h2>
          <span id="waitingCount" class="count">0</span>
        </div>
        <div id="waitingList" class="mail-list"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>رسائل تحتاج ردك</h2>
          <span id="mailCount" class="count">0</span>
        </div>
        <div id="mailList" class="mail-list"></div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>المتابعات</h2>
          <span id="actionsCount" class="count">0</span>
        </div>
        <div id="actionsList" class="actions-list"></div>
      </section>

      <section class="section" id="projectsSection">
        <div class="section-head">
          <h2>المشاريع</h2>
          <div class="section-tools">
            <span id="lastSync" class="last-sync">—</span>
            <div class="filters">
              <button class="filter active" data-filter="all" type="button">الكل</button>
              <button class="filter" data-filter="Critical" type="button">حرج</button>
              <button class="filter" data-filter="High" type="button">مرتفع</button>
              <button class="filter" data-filter="Medium" type="button">متوسط</button>
            </div>
          </div>
        </div>
        <div id="projectsGrid" class="projects-grid"></div>
      </section>
    </main>

    <div class="mobile-bar">
      <button id="installBtn" type="button">تثبيت</button>
      <button id="lockBtn" type="button">قفل</button>
    </div>
  </div>

  <script src="./app-v19.js?v=19" defer></script>
  <script src="./relay-v17.js?v=19" defer></script>
</body>
</html>
