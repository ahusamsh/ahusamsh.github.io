<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>الاستثمار</title>
  <link rel="manifest" href="./manifest.webmanifest?v=25">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles-v25.css?v=25">
</head>
<body>
  <div id="lockScreen" class="lock-screen">
    <section class="lock-card">
      <div class="brand-path">C:\استثمار\دخول&gt;</div>
      <h1>الاستثمار</h1>
      <form id="unlockForm" class="unlock-form">
        <label for="accessKey">مفتاح الوصول</label>
        <input id="accessKey" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">فتح</button>
        <label class="check-row"><input id="rememberKey" type="checkbox" checked><span>تذكّر المفتاح</span></label>
        <p id="lockError" class="form-error" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand"><div class="brand-path">C:\استثمار&gt;</div><h1>الاستثمار</h1></div>
      <div class="top-actions"><span id="syncBadge" class="sync-status syncing">● تحديث</span><button id="commandsBtn" type="button">الأوامر</button><button id="refreshBtn" type="button" aria-label="تحديث">↻</button></div>
    </header>

    <nav id="chatBar" class="chat-bar" aria-label="المحادثات المعتمدة"></nav>

    <main>
      <section id="summary" class="summary" aria-label="ملخص جميع المشاريع"></section>

      <section class="section">
        <div class="section-head"><h2>يحتاجك الآن</h2><span id="attentionCount" class="count">0</span></div>
        <div id="attentionList"></div>
        <button id="attentionListMore" class="more-btn hidden" type="button"></button>
      </section>

      <section class="section">
        <div class="section-head"><h2>آخر العمليات</h2><span id="operationsCount" class="count">0</span></div>
        <div id="operationsList"></div>
        <button id="operationsListMore" class="more-btn hidden" type="button"></button>
      </section>

      <section class="section">
        <div class="section-head">
          <h2>المشاريع</h2>
          <div class="projects-tools"><span id="lastSync" class="last-sync">—</span><div class="filters"><button class="filter active" data-filter="all" type="button">الكل</button><button class="filter" data-filter="Critical" type="button">حرج</button><button class="filter" data-filter="High" type="button">مرتفع</button><button class="filter" data-filter="Medium" type="button">متوسط</button></div><span id="projectsCount" class="count">0</span></div>
        </div>
        <div id="projectsList"></div>
        <button id="projectsListMore" class="more-btn hidden" type="button"></button>
      </section>
    </main>

    <div class="mobile-bar"><button id="installBtn" type="button">تثبيت</button><button id="lockBtn" type="button">قفل</button></div>
  </div>

  <div id="projectModal" class="modal hidden">
    <section class="modal-panel">
      <header class="modal-head"><div><span id="projectId" class="pid"></span><h2 id="projectTitle"></h2></div><button class="close-btn" data-close type="button">×</button></header>
      <div id="projectProgress"></div>
      <div id="projectStats" class="project-stats"></div>
      <div id="projectCurrent" class="project-current"></div>
      <div id="selectedEvent"></div>
      <section class="modal-section"><h3>خط سير المشروع</h3><div id="timelineList"></div></section>
      <section class="modal-section"><h3>أوامر المشروع</h3><div id="projectCommands"></div></section>
    </section>
  </div>

  <div id="commandsModal" class="modal hidden">
    <section class="modal-panel">
      <header class="modal-head"><h2>أوامر جميع المشاريع</h2><button class="close-btn" data-close type="button">×</button></header>
      <div id="commandsList" class="commands-list modal-section"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="./app-v25.js?v=25" defer></script>
  <script src="./relay-v17.js?v=25" defer></script>
</body>
</html>
