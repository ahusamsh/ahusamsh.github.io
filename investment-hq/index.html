<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>الاستثمار</title>
  <link rel="manifest" href="./manifest.webmanifest?v=22">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles-v22.css?v=22">
</head>
<body>
  <div id="lockScreen" class="lock-screen">
    <section class="lock-card">
      <div class="cmd">C:\INVESTMENT\HQ\AUTH&gt;</div>
      <h1>الاستثمار</h1>
      <form id="unlockForm" class="unlock-form">
        <label for="accessKey">مفتاح الوصول</label>
        <input id="accessKey" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">[ فتح ]</button>
        <label class="check-row"><input id="rememberKey" type="checkbox" checked><span>تذكّر المفتاح</span></label>
        <p id="lockError" class="form-error" aria-live="polite"></p>
      </form>
    </section>
  </div>

  <div id="app" class="app hidden">
    <header class="topbar">
      <div class="brand">
        <div class="brand-path">C:\INVESTMENT\HQ&gt;</div>
        <h1>الاستثمار</h1>
      </div>
      <div class="top-actions">
        <span id="syncBadge" class="sync-status syncing">● مزامنة…</span>
        <button id="commandsBtn" class="top-btn" type="button">أوامر</button>
        <button id="refreshBtn" class="icon-btn" type="button" aria-label="مزامنة">↻</button>
      </div>
    </header>

    <nav id="chatBar" class="chat-bar" aria-label="المحادثات"></nav>

    <main>
      <section id="metrics" class="metrics" aria-label="المؤشرات"></section>

      <section class="section">
        <div class="section-head"><h2>تحتاج إجراء</h2><span id="attentionCount" class="count">0</span></div>
        <div id="attentionList" class="attention-list"></div>
      </section>

      <section class="section">
        <div class="section-head"><h2>المتابعات القادمة</h2><span id="upcomingCount" class="count">0</span></div>
        <div id="upcomingList" class="upcoming-list"></div>
      </section>

      <section class="section" id="projectsSection">
        <div class="section-head">
          <h2>المشاريع <span id="projectsCount" class="count">0</span></h2>
          <div class="section-tools">
            <span id="lastSync" class="last-sync">—</span>
            <div class="filters">
              <button class="filter active" data-filter="all" type="button">الكل</button>
              <button class="filter" data-filter="Critical" type="button">حرج</button>
              <button class="filter" data-filter="High" type="button">مرتفع</button>
              <button class="filter" data-filter="Medium" type="button">متوسط</button>
            </div>
          </div>
        </div>
        <div id="projectsGrid" class="projects-grid"></div>
      </section>

      <section class="section">
        <div class="section-head"><h2>بانتظار الطرف الآخر</h2><span id="waitingCount" class="count">0</span></div>
        <div id="waitingList" class="waiting-list"></div>
      </section>
    </main>

    <div class="mobile-bar"><button id="installBtn" type="button">تثبيت</button><button id="lockBtn" type="button">قفل</button></div>
  </div>

  <div id="projectModal" class="modal hidden">
    <section class="modal-panel">
      <header class="modal-head"><div><span id="projectId" class="pid"></span><h2 id="projectTitle"></h2></div><button class="close-btn" data-close type="button">×</button></header>
      <div id="projectStats"></div>
      <div id="projectCurrent" class="project-current"></div>
      <section class="modal-section"><h3>خط سير المشروع</h3><div id="timelineList" class="timeline-list"></div></section>
      <section class="modal-section"><h3>أوامر المشروع</h3><div id="projectCommands" class="commands-list"></div></section>
    </section>
  </div>

  <div id="commandsModal" class="modal hidden">
    <section class="modal-panel">
      <header class="modal-head"><h2 id="commandsTitle">أوامر جميع المشاريع</h2><button class="close-btn" data-close type="button">×</button></header>
      <div id="commandsList" class="commands-list modal-section"></div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./app-v22.js?v=22" defer></script>
  <script src="./relay-v17.js?v=22" defer></script>
</body>
</html>
