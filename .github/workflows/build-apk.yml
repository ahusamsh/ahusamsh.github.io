name: Build DarbPath Admin APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept Android SDK licenses
      run: yes | sdkmanager --licenses || true

    - name: Install Android SDK components
      run: |
        sdkmanager "platforms;android-33" "build-tools;33.0.2"

    - name: Create Gradle wrapper
      working-directory: android
      run: |
        # Install Gradle
        wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
        unzip -q /tmp/gradle.zip -d /tmp
        export PATH="/tmp/gradle-8.4/bin:$PATH"
        # Generate the wrapper
        gradle wrapper
        chmod +x gradlew

    - name: Build Release APK
      working-directory: android
      run: ./gradlew assembleRelease --no-daemon

    - name: Sign APK
      working-directory: android
      run: |
        # Generate a keystore
        keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=Darb, OU=Darb, O=Darb, L=Riyadh, S=Riyadh, C=SA"
        # Find the release APK
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | grep -v unaligned | head -n 1)
        # Sign it
        $ANDROID_HOME/build-tools/33.0.2/apksigner sign --ks release.keystore --ks-pass pass:password --key-pass pass:password "$APK_PATH"
        # Move it to a predictable location
        mv "$APK_PATH" app-release-signed.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: DarbPathAdmin-Release
        path: android/app-release-signed.apk
        retention-days: 30
