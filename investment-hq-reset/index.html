<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Investment HQ Reset</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1016;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}.card{max-width:520px;margin:24px;padding:28px;border:1px solid #24303d;border-radius:20px;background:#101821;text-align:center}.muted{color:#9aa7b5}button{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>تحديث Investment HQ</h1>
<p id="status" class="muted">جارٍ تنظيف نسخة PWA القديمة…</p>
<button id="go" hidden>فتح الداشبورد</button>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.filter(r=>r.scope.includes('/investment-hq/')).map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.filter(k=>k.startsWith('investment-hq-')).map(k=>caches.delete(k)));
    }
    status.textContent='تم تنظيف النسخة القديمة. سيتم فتح BUILD v14 الآن.';
  }catch(e){status.textContent='تم تنفيذ التحديث بقدر ما يسمح به المتصفح.'}
  const target='https://darbpath.com/investment-hq/?build=14&fresh='+Date.now();
  const btn=document.getElementById('go');btn.hidden=false;btn.onclick=()=>location.replace(target);
  setTimeout(()=>location.replace(target),1200);
})();
</script>
</body>
</html>
